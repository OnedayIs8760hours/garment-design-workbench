# 前端静态服务：服务 SPA 构建产物，并把 /api 反向代理到后端容器。
server {
  listen 80;
  server_name _;

  # 基于 hash 或带版本号的静态资源长缓存
  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 使用运行期 DNS，未启用 generation profile 时也不影响其他页面启动。
  location /api/agent/ {
    resolver 127.0.0.11 valid=30s;
    set $agent_upstream http://agent:8958;
    proxy_pass $agent_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 40m;
  }

  # API 反代到后端服务（compose 内部网络名为 backend）
  location /api/ {
    proxy_pass http://backend:8957;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大文件上传（素材/PSD）放开默认限制
    client_max_body_size 50m;
  }

  # 其余路径回退到 index.html（SPA 路由）
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
