# 前端静态服务：服务 SPA 构建产物，并把 /api 反向代理到后端容器。
server {
  listen 80;
  server_name _;

  location /erp/java-api/ {
    resolver 127.0.0.11 valid=30s;
    set $erp_java_upstream ${ERP_JAVA_UPSTREAM};
    rewrite ^/erp/java-api(/.*)$ $1 break;
    proxy_pass $erp_java_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 50m;
  }

  location /erp/ {
    resolver 127.0.0.11 valid=30s;
    set $erp_python_upstream ${ERP_PYTHON_UPSTREAM};
    rewrite ^/erp(/.*)$ $1 break;
    proxy_pass $erp_python_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 50m;
  }

  # 基于 hash 或带版本号的静态资源长缓存
  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 运行期 DNS：Agent 容器重建后可以重新解析其地址。
  location /api/agent/ {
    resolver 127.0.0.11 valid=30s;
    set $agent_upstream http://agent:8958;
    proxy_pass $agent_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 40m;
  }

  # API 反代到后端服务（compose 内部网络名为 backend）
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8957;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大文件上传（素材/PSD）放开默认限制
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
  }

  # 其余路径回退到 index.html（SPA 路由）
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
