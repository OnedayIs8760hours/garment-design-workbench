[project]
name = "sds-design-backend"
version = "0.1.0"
description = "SDS Design FastAPI backend services"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1",
  "sqlalchemy>=2.0.54",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
]
