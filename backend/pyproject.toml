[project]
name = "sds-design-backend"
version = "0.1.0"
description = "SDS Design FastAPI backend services"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi==0.116.1",
  "python-dotenv>=1.2.1",
  "PyJWT>=2.10.1",
  "pwdlib[argon2]>=0.2.1",
  "redis>=8.1.0",
  "sqlalchemy>=2.0.54",
  "uvicorn[standard]==0.35.0",
  "boto3>=1.43.109",
  "python-multipart>=0.0.32",
  "anyio>=4.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
]
