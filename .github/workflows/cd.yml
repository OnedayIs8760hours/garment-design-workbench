name: CD

# 预留的持续交付流水线：手动触发，或在打 vX.Y.Z 标签时触发。
# 需要先在仓库 Settings > Secrets and variables > Actions 里配置：
#   REGISTRY           默认 ghcr.io
#   IMAGE_NAMESPACE   例如你的 GitHub 用户名/组织（用于构造镜像名）
#   SSH_HOST / SSH_PORT / SSH_USER / SSH_KEY   （如果用 ssh-action 远程部署）
# 确定部署目标后再启用部署步骤。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: woda-custom # TODO: 替换为你的 GitHub 用户/组织，或从变量读取
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/woda-design-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/woda-design-frontend:${{ env.IMAGE_TAG }}

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/woda-design-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/woda-design-backend:${{ env.IMAGE_TAG }}

